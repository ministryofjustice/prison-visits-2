name: Build & push docker image and deploy to environment

on:
  workflow_call:
    inputs:
      docker_registry:
        description: Docker registry
        required: true
        type: string
      registry_org:
        description: Docker registry organisation
        required: true
        type: string
      additional_docker_tag:
        description: Additional docker tag that can be used to specify stable tags
        required: false
        type: string
      tag_latest:
        description: Tag docker image as 'latest'
        required: false
        type: boolean
        default: true
      upload_image_artifact:
        description: Upload image to artifacts in GitHub Actions
        required: false
        type: boolean
        default: false
      image_artifact_retention_days:
        description: Number of days to keep the image in artifacts
        required: false
        type: number
        default: 7
      additional_docker_build_args:
        description: Additional docker build arguments
        required: false
        type: string
      additional_docker_secrets_args: 
        description: Additional docker build secrets arguments
        required: false
        type: string
      push:
        description: Push docker image to registry flag
        required: true
        type: boolean
      load:
        description: Load docker image into local docker
        required: false
        type: boolean
        default: false
      docker_multiplatform:
        description: Docker image build multiplatform or not
        required: true
        type: boolean
        default: true
      image_name:
        description: Name of the image
        required: false
        type: string
      image_version:
        description: Version tag of the image. Generated when not provided
        required: false
        type: string
        default: ''
      file:
        description: "Path to the Dockerfile"
        required: false
        type: string
      download_build_artifacts:
        description: Whether to download the build artifacts prior to running the docker build
        required: false
        type: boolean
        default: false
      generate_sbom:
        description: Generate an SBOM for the final pushed image and upload it as a workflow artifact
        required: false
        type: boolean
        default: false
      attach_sbom_to_registry:
        description: Create and push an SBOM attestation for the pushed image in the container registry
        required: false
        type: boolean
        default: false
      sign_image:
        description: Sign pushed image digest in the container registry
        required: false
        type: boolean
        default: false
    secrets:
      HMPPS_QUAYIO_USER:
        required: false
      HMPPS_QUAYIO_TOKEN:
        required: false

    outputs:
      app_version:
        description: The version of the app as generated by create_app_version
        value: ${{ jobs.create_version.outputs.version }}

jobs:
  create_version:
    name: Create app version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.image_version.outputs.version }}
    steps:
      - id: app_version
        name: Create application version
        if: inputs.image_version == ''
        uses: ministryofjustice/hmpps-github-shared-actions/.github/actions/build-test-and-deploy/create_app_version@cf153ef9fac2a87d0ae26cdd67c6b54dc6ce32f4 # v1.1.10
      - id: image_version
        shell: bash
        env:
          IMAGE_VERSION: ${{ inputs.image_version || steps.app_version.outputs.version }}
        run: |
          echo "version=${IMAGE_VERSION}" >> $GITHUB_OUTPUT

  docker_build:
    name: Build linux/amd64 (single)
    if: ${{ ! inputs.docker_multiplatform }}
    needs: [create_version]
    runs-on: ubuntu-latest
    outputs:
      image_digest: ${{ steps.build_docker_step.outputs.digest }}
    steps:
      - name: Obtain Octo STS Token
        uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        id: octo_sts_email
        with:
          scope: ministryofjustice/email_address_validation
          identity: ministryofjustice-prison-visits-public
      - name: Checkout ministryofjustice/email_address_validation
        id: checkout_private_repo_email
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          token: ${{ steps.octo_sts_email.outputs.token }}
          repository: ministryofjustice/email_address_validation
          path: ministryofjustice/email_address_validation
      - id: build_docker_step
        uses: ministryofjustice/hmpps-github-shared-actions/.github/actions/build-test-and-deploy/build_docker@cf153ef9fac2a87d0ae26cdd67c6b54dc6ce32f4 # v1.1.10
        if: ${{ inputs.docker_registry == 'ghcr.io' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OCTO_NETRC: ${{ format('machine github.com login x-access-token password {0}', steps.octo_sts_email.outputs.token) }}
        with:
          image_name: ${{ inputs.image_name || github.event.repository.name }}
          docker_registry: ${{ inputs.docker_registry }}
          registry_org: ${{ inputs.registry_org }}
          additional_docker_tag: ${{ inputs.additional_docker_tag }}
          tag_latest: ${{ inputs.tag_latest }}
          upload_image_artifact: ${{ inputs.upload_image_artifact }}
          image_artifact_retention_days: ${{ inputs.image_artifact_retention_days }}
          push: ${{ inputs.push }}
          load: ${{ inputs.load }}
          app_version: ${{ needs.create_version.outputs.version }}
          additional_docker_build_args: ${{ inputs.additional_docker_build_args }}
          additional_docker_secrets_args: |
            github_netrc=OCTO_NETRC
            ${{ inputs.additional_docker_secrets_args }}
          file: ${{ inputs.file }}
          download_build_artifacts: ${{ inputs.download_build_artifacts }}

      - uses: ministryofjustice/hmpps-github-shared-actions/.github/actions/build-test-and-deploy/build_docker@cf153ef9fac2a87d0ae26cdd67c6b54dc6ce32f4 # v1.1.10
        if: ${{ inputs.docker_registry == 'quay.io' }}
        with:
          image_name: ${{ inputs.image_name || github.event.repository.name }}
          docker_registry: ${{ inputs.docker_registry }}
          registry_org: ${{ inputs.registry_org }}
          additional_docker_tag: ${{ inputs.additional_docker_tag }}
          tag_latest: ${{ inputs.tag_latest }}
          upload_image_artifact: ${{ inputs.upload_image_artifact }}
          image_artifact_retention_days: ${{ inputs.image_artifact_retention_days }}
          push: ${{ inputs.push }}
          load: ${{ inputs.load }}
          app_version: ${{ needs.create_version.outputs.version }}
          HMPPS_QUAYIO_USER: ${{ secrets.HMPPS_QUAYIO_USER }}
          HMPPS_QUAYIO_TOKEN: ${{ secrets.HMPPS_QUAYIO_TOKEN}}
          additional_docker_build_args: ${{ inputs.additional_docker_build_args }}
          additional_docker_secrets_args: ${{ inputs.additional_docker_secrets_args }}
          download_build_artifacts: ${{ inputs.download_build_artifacts }}

  docker_build_platform:
    name: Build ${{ matrix.platform }} (parallel)
    if: ${{ inputs.docker_multiplatform }}
    needs: [create_version]
    env:
      GITHUB_TOKEN: ${{ github.token }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download build artifacts needed for docker build
        if: ${{ inputs.download_build_artifacts }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-results

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Prepare platform pair
        id: prepare
        shell: bash
        run: |
            echo "platform_pair=${platform//\//-}" >> "${GITHUB_OUTPUT}"
        env:
          platform: ${{ matrix.platform }}

      - name: Build docker archive tarball
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          file: ${{ inputs.file }}
          build-args: |
            "BUILD_NUMBER=${{ needs.create_version.outputs.version }}"
            "GIT_REF=${{ github.sha }}"
            "GIT_BRANCH=${{ github.ref_name }}"
            "${{ inputs.additional_docker_build_args }}"
          secret-envs: ${{ inputs.additional_docker_secrets_args }}
          outputs: type=docker,name=${{ inputs.docker_registry }}/${{ inputs.registry_org }}/${{ inputs.image_name || github.event.repository.name }}:${{ needs.create_version.outputs.version }},dest=${{ runner.temp }}/image.tar
          cache-from: type=gha,scope=build-${{ steps.prepare.outputs.platform_pair }}
          cache-to: type=gha,scope=build-${{ steps.prepare.outputs.platform_pair }},mode=max
          provenance: false

      - name: Upload image tarball
        if: ${{ inputs.push || inputs.upload_image_artifact }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ steps.prepare.outputs.platform_pair }}
          path: ${{ runner.temp }}/image.tar
          if-no-files-found: error
          retention-days: ${{ inputs.upload_image_artifact && inputs.image_artifact_retention_days || 1 }}

  docker_build_merge:
    name: Push multi-platform image
    if: ${{ inputs.docker_multiplatform && inputs.push }}
    needs: [create_version, docker_build_platform]
    uses: ministryofjustice/hmpps-github-actions/.github/workflows/docker_push.yml@v2
    secrets:
      HMPPS_QUAYIO_USER: ${{ secrets.HMPPS_QUAYIO_USER }}
      HMPPS_QUAYIO_TOKEN: ${{ secrets.HMPPS_QUAYIO_TOKEN }}
    with:
      docker_registry: ${{ inputs.docker_registry }}
      registry_org: ${{ inputs.registry_org }}
      image_name: ${{ inputs.image_name }}
      app_version: ${{ needs.create_version.outputs.version }}
      tag_latest: ${{ inputs.tag_latest }}
      additional_docker_tag: ${{ inputs.additional_docker_tag }}
      docker_multiplatform: true

  sign_image_single_platform:
    name: Sign image (single-platform)
    if: ${{ inputs.sign_image && !inputs.docker_multiplatform && inputs.push && inputs.docker_registry == 'ghcr.io' }}
    needs: [create_version, docker_build]
    uses: ministryofjustice/hmpps-github-actions/.github/workflows/docker_sign.yml@v2
    with:
      docker_registry: ${{ inputs.docker_registry }}
      registry_org: ${{ inputs.registry_org }}
      image_name: ${{ inputs.image_name }}
      image_digest: ${{ needs.docker_build.outputs.image_digest }}

  sign_image_multi_platform:
    name: Sign image (multi-platform)
    if: ${{ inputs.sign_image && inputs.docker_multiplatform && inputs.push && inputs.docker_registry == 'ghcr.io' }}
    needs: [create_version, docker_build_merge]
    uses: ministryofjustice/hmpps-github-actions/.github/workflows/docker_sign.yml@v2
    with:
      docker_registry: ${{ inputs.docker_registry }}
      registry_org: ${{ inputs.registry_org }}
      image_name: ${{ inputs.image_name }}
      image_digest: ${{ needs.docker_build_merge.outputs.image_digest }}

  generate_sbom_single_platform:
    name: Generate SBOM (single-platform image)
    if: ${{ inputs.generate_sbom && !inputs.docker_multiplatform && inputs.push && inputs.docker_registry == 'ghcr.io' }}
    needs: [create_version, docker_build]
    uses: ministryofjustice/hmpps-github-actions/.github/workflows/docker_sbom.yml@v2
    with:
      docker_registry: ${{ inputs.docker_registry }}
      registry_org: ${{ inputs.registry_org }}
      image_name: ${{ inputs.image_name }}
      app_version: ${{ needs.create_version.outputs.version }}
      image_digest: ${{ needs.docker_build.outputs.image_digest }}
      attach_sbom_to_registry: ${{ inputs.attach_sbom_to_registry }}

  generate_sbom_multi_platform:
    name: Generate SBOM (multi-platform image)
    if: ${{ inputs.generate_sbom && inputs.docker_multiplatform && inputs.push && inputs.docker_registry == 'ghcr.io' }}
    needs: [create_version, docker_build_merge]
    uses: ministryofjustice/hmpps-github-actions/.github/workflows/docker_sbom.yml@v2
    with:
      docker_registry: ${{ inputs.docker_registry }}
      registry_org: ${{ inputs.registry_org }}
      image_name: ${{ inputs.image_name }}
      app_version: ${{ needs.create_version.outputs.version }}
      image_digest: ${{ needs.docker_build_merge.outputs.image_digest }}
      attach_sbom_to_registry: ${{ inputs.attach_sbom_to_registry }}
